name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (pinned v4.1.0)
        uses: actions/checkout@8f4b7f84864484a7bf31766abe9204da3cbe65b3d
      - name: Setup Python (pinned v5.3.0)
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .[suite]
      - name: Terminal scan (self-containment gate)
        run: python conformance/terminal_scan.py
      - name: Conformance suite (three separated metrics)
        run: python conformance/run_suite.py
      - name: Smoke tests
        run: |
          pip install pytest -q
          pytest tests/ -q
      - name: Build + twine check
        run: |
          pip install build twine -q
          python -m build --sdist --wheel -o dist .
          python -m twine check dist/*
