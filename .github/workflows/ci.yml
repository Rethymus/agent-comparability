name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (pinned)
        uses: actions/checkout@8f4b7f84864484a7bf31766abe9204da3cbe65b3d
      - name: Setup Python (pinned)
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .[suite,inspect,pydantic] pytest -q
      - name: Terminal scan (self-containment gate)
        run: python conformance/terminal_scan.py
      - name: Doc sync & links (bilingual gate)
        run: python conformance/check_docs.py
      - name: Conformance suite (three separated metrics; integration metric must execute)
        run: python conformance/run_suite.py
      - name: Adapters actually run (inspect + pydantic)
        run: |
          python adapters/inspect_adapter.py
          python adapters/pydantic_adapter.py
      - name: Tests (smoke + properties + gate regressions N1-N4)
        run: python -m pytest tests/ -q
      - name: Release version-consistency gate
        run: python conformance/release_gate.py
      - name: Build + twine check
        run: |
          pip install build twine -q
          python -m build --sdist --wheel -o dist .
          python -m twine check dist/*
      - name: Package content gate (spec+cases must ship)
        run: |
          python - <<'PY'
          import glob, json, tarfile, zipfile
          need = ["LICENSE", "NOTICE", "data/SPEC.md", "data/cdr.schema.json",
                  "data/boundary-cases.json", "data/frozen-cases-a.json"]
          for art in glob.glob("dist/*"):
              names = tarfile.open(art).getnames() if art.endswith(".tar.gz") else zipfile.ZipFile(art).namelist()
              missing = [x for x in need if not any(n.endswith(x) for n in names)]
              assert not missing, f"{art} missing {missing}"
          print("package content gate OK")
          PY
