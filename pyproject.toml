[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-comparability"
version = "0.5.3"
description = "Agent evaluation comparability semantics: spec + conformance suite + thin reference implementation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.urls]
Homepage = "https://github.com/Rethymus/agent-comparability"
Repository = "https://github.com/Rethymus/agent-comparability"
Issues = "https://github.com/Rethymus/agent-comparability/issues"
Changelog = "https://github.com/Rethymus/agent-comparability/blob/main/CHANGELOG.md"

[project.optional-dependencies]
suite = ["pyyaml", "jsonschema"]
inspect = ["inspect-ai"]
pydantic = ["pydantic-evals"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_comparability = ["data/*"]
