[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-comparability"
version = "0.3.1"
description = "Agent evaluation comparability semantics: spec + conformance suite + thin reference implementation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
suite = ["pyyaml", "jsonschema"]
inspect = ["inspect-ai"]
pydantic = ["pydantic-evals"]

[tool.setuptools.packages.find]
where = ["src"]
